<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barcode Scan Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: camera viewfinder beside (or above, on phones) a plain-text note that grows one line per scan. */
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --fg: #17201c;
    --muted: #5d6b64;
    --line: #d5ddd9;
    --accent: #0a7d55;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --scan: #2ee59d;
    --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --surface: #171e1b; --fg: #e4ebe7; --muted: #93a39b;
      --line: #2a3530; --accent: #34c48b; --accent-fg: #06140e; --danger: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 var(--font-ui);
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .engine { font: 12px var(--font-code); color: var(--muted); }

  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }

  .viewer { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #000; border-radius: 6px; overflow: hidden; }
  .viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle { position: absolute; inset: 18% 10%; border: 2px solid rgba(255,255,255,.55); border-radius: 8px; pointer-events: none; transition: border-color .15s; }
  .reticle.hit { border-color: var(--scan); box-shadow: 0 0 0 4px rgba(46,229,157,.25); }
  .idle { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #cfd8d3; padding: 24px; font-size: 14px; }
  .toast { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(8,14,11,.82); color: #fff; border-radius: 6px; padding: 8px 10px; font: 13px var(--font-code); overflow-wrap: anywhere; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: none; }
  .toast b { color: var(--scan); font-weight: 500; margin-right: 6px; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select {
    font: 500 14px var(--font-ui); border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); padding: 8px 12px; cursor: pointer; min-height: 38px;
  }
  select { min-width: 0; max-width: 100%; flex: 1 1 180px; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); }

  .notehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .notehead h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .count { font: 12px var(--font-code); color: var(--muted); font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 320px; resize: vertical; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); padding: 10px 12px; font: 14px/1.6 var(--font-code); white-space: pre; overflow-wrap: normal; overflow-x: auto;
  }
  .status { font-size: 13px; color: var(--muted); min-height: 1.5em; }
  .status.error { color: var(--danger); }
  .filechip { font: 12px var(--font-code); color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .toast, .reticle { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Barcode Scan Log</h1>
    <span class="engine" id="engine">Checking scanner…</span>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Camera">
      <div class="viewer">
        <video id="video" playsinline muted></video>
        <div class="reticle" id="reticle"></div>
        <div class="idle" id="idle">Press <strong>&nbsp;Start camera&nbsp;</strong> and point it at a barcode or QR code.</div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="row">
        <button class="primary" id="startBtn" type="button">Start camera</button>
        <button id="stopBtn" type="button" disabled>Stop</button>
        <select id="cameraSel" aria-label="Camera" hidden></select>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="onceChk"> Log each code only once</label>
        <label class="check"><input type="checkbox" id="soundChk" checked> Beep on scan</label>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="panel" aria-label="Scan note">
      <div class="notehead">
        <h2>Scans</h2>
        <span class="count" id="count">0 lines</span>
      </div>
      <textarea id="note" spellcheck="false" aria-label="Scanned values, one per line" placeholder="Scanned values appear here, one per line."></textarea>
      <div class="row">
        <button id="copyBtn" type="button">Copy</button>
        <button id="downloadBtn" type="button">Download .txt</button>
        <button id="linkBtn" type="button" hidden>Save live to a file…</button>
        <button class="danger" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="filechip" id="fileChip" hidden></div>
    </section>
  </div>
</div>

<!-- Fallback decoder for browsers without the built-in BarcodeDetector (Safari, Firefox, desktop Chrome on some OSes). -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), note = $('note'), statusEl = $('status');
  const STORE_KEY = 'barcode-scan-note';
  const REPEAT_GAP_MS = 2500; // a code must leave view this long before it is logged again

  let detector = null, zxReader = null, engine = null;
  let stream = null, running = false, loopTimer = null, wakeLock = null;
  let fileHandle = null, writeTimer = null;
  const lastSeen = new Map();
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- note ----------
  function safeGet() { try { return localStorage.getItem(STORE_KEY) || ''; } catch { return ''; } }
  function safeSet(v) { try { localStorage.setItem(STORE_KEY, v); } catch {} }
  note.value = safeGet();
  updateCount();

  function lines() { return note.value.split('\n').filter(l => l.trim() !== ''); }
  function updateCount() { const n = lines().length; $('count').textContent = n + (n === 1 ? ' line' : ' lines'); }
  function noteChanged() { safeSet(note.value); updateCount(); scheduleFileWrite(); }
  note.addEventListener('input', noteChanged);

  function appendLine(text) {
    const base = note.value.replace(/\n+$/, '');
    note.value = base ? base + '\n' + text : text;
    note.scrollTop = note.scrollHeight;
    noteChanged();
  }

  // ---------- detector ----------
  async function initDetector() {
    if ('BarcodeDetector' in window) {
      try {
        const formats = await BarcodeDetector.getSupportedFormats();
        if (formats.length) { detector = new BarcodeDetector({ formats }); engine = 'native'; }
      } catch {}
    }
    if (!engine && window.ZXing) {
      const Z = window.ZXing, F = Z.BarcodeFormat;
      const hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
        F.QR_CODE, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93,
        F.CODABAR, F.ITF, F.DATA_MATRIX, F.PDF_417, F.AZTEC, F.RSS_14
      ]);
      zxReader = new Z.MultiFormatReader();
      zxReader.setHints(hints);
      engine = 'zxing';
    }
    $('engine').textContent = engine === 'native' ? 'Built-in barcode detector'
      : engine === 'zxing' ? 'ZXing decoder' : 'No decoder available';
    if (!engine) setStatus('No barcode decoder could load. Connect to the internet once so the ZXing library can download, then reload.', true);
  }

  async function detectFrame() {
    if (!video.videoWidth) return [];
    if (engine === 'native') {
      const found = await detector.detect(video);
      return found.map(b => ({ text: b.rawValue, format: b.format }));
    }
    // ZXing: draw a downscaled frame and decode it
    const scale = Math.min(1, 960 / video.videoWidth);
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    try {
      const Z = window.ZXing;
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
      const r = zxReader.decodeWithState(bmp);
      return [{ text: r.getText(), format: String(Z.BarcodeFormat[r.getBarcodeFormat()] || '').toLowerCase() }];
    } catch { return []; } // NotFoundException means nothing in this frame
  }

  async function loop() {
    if (!running) return;
    try {
      const now = Date.now();
      for (const { text, format } of await detectFrame()) {
        if (!text) continue;
        const prev = lastSeen.get(text);
        lastSeen.set(text, $('onceChk').checked ? Infinity : now);
        if (prev !== undefined && (prev === Infinity || now - prev < REPEAT_GAP_MS)) continue;
        if ($('onceChk').checked && lines().includes(text)) continue;
        appendLine(text);
        feedback(text, format);
      }
    } catch (e) { /* a dropped frame is fine */ }
    loopTimer = setTimeout(loop, engine === 'native' ? 90 : 160);
  }

  // ---------- feedback ----------
  let audioCtx = null, toastTimer = null;
  function feedback(text, format) {
    const r = $('reticle'); r.classList.add('hit'); setTimeout(() => r.classList.remove('hit'), 350);
    const t = $('toast'); t.innerHTML = ''; const b = document.createElement('b');
    b.textContent = (format || 'code').replace(/_/g, ' ').toUpperCase();
    t.append(b, document.createTextNode(text)); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    if (navigator.vibrate) navigator.vibrate(60);
    if ($('soundChk').checked && audioCtx) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 1320; g.gain.value = 0.08;
      o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.08);
    }
  }

  // ---------- camera ----------
  function setStatus(msg, isError) { statusEl.textContent = msg || ''; statusEl.classList.toggle('error', !!isError); }

  async function start(deviceId) {
    if (!engine) return;
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      setStatus('The camera only works when this page is opened over https://, from localhost, or as a local file in Chrome/Edge.', true);
      return;
    }
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    stopStream();
    setStatus('Starting camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId } }
                        : { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
    } catch (e) {
      const msg = e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this page in your browser settings, then press Start camera again.'
        : e.name === 'NotFoundError' ? 'No camera was found on this device.'
        : e.name === 'NotReadableError' ? 'The camera is in use by another app. Close it and try again.'
        : 'Could not start the camera: ' + e.message;
      setStatus(msg, true); return;
    }
    video.srcObject = stream;
    await video.play().catch(() => {});
    running = true;
    $('idle').hidden = true; $('startBtn').disabled = true; $('stopBtn').disabled = false;
    setStatus('Scanning. Each new code is added as a line.');
    fillCameraList();
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    loop();
  }

  function stopStream() {
    running = false; clearTimeout(loopTimer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  function stop() {
    stopStream(); video.srcObject = null;
    $('idle').hidden = false; $('startBtn').disabled = false; $('stopBtn').disabled = true;
    try { wakeLock?.release(); } catch {} wakeLock = null;
    setStatus('Camera stopped.');
  }

  async function fillCameraList() {
    const sel = $('cameraSel');
    try {
      const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      if (cams.length < 2) { sel.hidden = true; return; }
      const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
      sel.innerHTML = '';
      cams.forEach((c, i) => {
        const o = document.createElement('option');
        o.value = c.deviceId; o.textContent = c.label || 'Camera ' + (i + 1);
        if (c.deviceId === current) o.selected = true;
        sel.append(o);
      });
      sel.hidden = false;
    } catch { sel.hidden = true; }
  }

  $('startBtn').addEventListener('click', () => start());
  $('stopBtn').addEventListener('click', stop);
  $('cameraSel').addEventListener('change', e => start(e.target.value));
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && running && !wakeLock) {
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
    }
  });

  // ---------- note actions ----------
  function fileText() { const v = note.value.replace(/\n+$/, ''); return v ? v + '\n' : ''; }

  $('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(fileText()); flashBtn('copyBtn', 'Copied'); }
    catch { note.focus(); note.select(); flashBtn('copyBtn', 'Press Ctrl/⌘+C'); }
  });

  $('downloadBtn').addEventListener('click', () => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `scans-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.txt`;
    const url = URL.createObjectURL(new Blob([fileText()], { type: 'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  let clearArmed = null;
  $('clearBtn').addEventListener('click', () => {
    const btn = $('clearBtn');
    if (!clearArmed) {
      btn.textContent = 'Tap again to clear';
      clearArmed = setTimeout(() => { btn.textContent = 'Clear'; clearArmed = null; }, 3000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; btn.textContent = 'Clear';
    note.value = ''; lastSeen.clear(); noteChanged();
  });

  function flashBtn(id, label) {
    const b = $(id), orig = b.dataset.label || b.textContent; b.dataset.label = orig;
    b.textContent = label; setTimeout(() => { b.textContent = orig; }, 1400);
  }

  // Live file writing (Chrome/Edge desktop): every scan rewrites the chosen .txt file.
  if ('showSaveFilePicker' in window) {
    $('linkBtn').hidden = false;
    $('linkBtn').addEventListener('click', async () => {
      try {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'scans.txt',
          types: [{ description: 'Text file', accept: { 'text/plain': ['.txt'] } }]
        });
        await writeFile();
        $('fileChip').textContent = 'Writing every scan to ' + fileHandle.name;
        $('fileChip').hidden = false;
        $('linkBtn').textContent = 'Change file…';
      } catch (e) { if (e.name !== 'AbortError') setStatus('Could not open that file: ' + e.message, true); }
    });
  }
  function scheduleFileWrite() { if (!fileHandle) return; clearTimeout(writeTimer); writeTimer = setTimeout(writeFile, 250); }
  async function writeFile() {
    if (!fileHandle) return;
    try { const w = await fileHandle.createWritable(); await w.write(fileText()); await w.close(); }
    catch (e) { setStatus('Writing to ' + fileHandle.name + ' failed: ' + e.message, true); }
  }

  initDetector();
})();
</script>
</body>
</html>
